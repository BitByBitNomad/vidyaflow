version: '3.8'

services:
  # PostgreSQL Database (Supabase PostgreSQL Compatible)
  postgres:
    image: postgres:16-alpine
    container_name: vidyaflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vidyaflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vidyaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Live Leaderboard (Sorted Sets)
  redis:
    image: redis:7-alpine
    container_name: vidyaflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Production Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidyaflow_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vidyaflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: vidyaflow_production_grade_jwt_secret_key_super_secure_2026
      SUPABASE_URL: https://your-project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: your-publishable-key
      SUPABASE_SECRET_KEY: your-secret-key
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidyaflow_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
